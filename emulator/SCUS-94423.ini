; DuckStation per-game settings for Ape Escape (USA), SCUS-94423.
; Copy into DuckStation's gamesettings folder. The mods need the dev console's
; 8 MB of RAM, and a 200% CPU clock keeps the powered-up gadgets at full speed.
[Console]
Enable8MBRAM = true

[CPU]
OverclockEnable = true
OverclockNumerator = 2
OverclockDenominator = 1
